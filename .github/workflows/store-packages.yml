name: Prepare store packages and screenshots
on:
  workflow_dispatch:
    inputs:
      target:
        description: Store preparation task
        required: true
        type: choice
        options: [windows, ios-screenshots, android-screenshots, ios-device-archive, mac-store-unsigned]
      ios_devices:
        description: Native iOS simulator coverage
        type: choice
        default: all
        options: [all, tablets, iPhone, iPad, iPadAir]
      windows_identity:
        description: Exact Package/Identity/Name from Microsoft Partner Center
        type: string
      windows_publisher:
        description: Exact Package/Identity/Publisher from Microsoft Partner Center
        type: string
      windows_publisher_name:
        description: Exact publisher display name from Microsoft Partner Center
        type: string
permissions:
  contents: read
jobs:
  mac-store-unsigned:
    if: inputs.target == 'mac-store-unsigned'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --config build/mac-store.cjs --mac --publish never
        env:
          MAS_UNSIGNED: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Preserve unsigned universal MAS app for local signing
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'store-release/mac-app-store/mas-universal/Eksaar Panchang.app' store-release/Eksaar-Panchang-Mac-App-Store-UNSIGNED.zip
          shasum -a 256 store-release/Eksaar-Panchang-Mac-App-Store-UNSIGNED.zip > store-release/MAS-archive-SHA256.txt
          git rev-parse HEAD > store-release/MAS-source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-app-store-unsigned-not-installable
          path: |
            store-release/Eksaar-Panchang-Mac-App-Store-UNSIGNED.zip
            store-release/MAS-archive-SHA256.txt
            store-release/MAS-source-commit.txt
  ios-device-archive:
    if: inputs.target == 'ios-device-archive'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ios-native
      - name: Archive the device release without uploading signing credentials
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath store-release/Eksaar-Panchang-UNSIGNED.xcarchive CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=2.0.0 CURRENT_PROJECT_VERSION=5 archive
      - name: Preserve archive permissions and provenance
        run: |
          xcodebuild -version > store-release/Xcode-version.txt
          git rev-parse HEAD > store-release/Source-commit.txt
          ditto -c -k --sequesterRsrc --keepParent store-release/Eksaar-Panchang-UNSIGNED.xcarchive store-release/Eksaar-Panchang-iOS-Device-UNSIGNED.zip
          shasum -a 256 store-release/Eksaar-Panchang-iOS-Device-UNSIGNED.zip > store-release/Device-archive-SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-device-archive-unsigned-not-installable
          path: |
            store-release/Eksaar-Panchang-iOS-Device-UNSIGNED.zip
            store-release/Xcode-version.txt
            store-release/Source-commit.txt
            store-release/Device-archive-SHA256.txt
  android-screenshots:
    if: inputs.target == 'android-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' emulator 'system-images;android-36;google_apis;x86_64'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android
      - run: bash ./gradlew assembleDebug
        working-directory: android
      - name: Enable emulator acceleration on the disposable runner
        run: sudo chmod a+rw /dev/kvm
      - run: python3 scripts/android-store-screenshots.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-store-screenshots
          path: store-release/android-screenshots/
  windows:
    if: inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm test
      - run: node node_modules/electron/install.js
      - run: pnpm build
      - run: pnpm test:desktop
      - run: pnpm exec electron-builder --config build/windows-store.cjs --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WINDOWS_STORE_IDENTITY: ${{ inputs.windows_identity }}
          WINDOWS_STORE_PUBLISHER: ${{ inputs.windows_publisher }}
          WINDOWS_STORE_PUBLISHER_NAME: ${{ inputs.windows_publisher_name }}
      - name: Verify the actual AppX icons and manifest before upload
        run: python scripts/verify-windows-store.py
      - name: Record package checksums
        shell: pwsh
        run: Get-ChildItem store-release/windows/*.appx | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content store-release/windows/SHA256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microsoft-store-upload-packages
          path: |
            store-release/windows/*.appx
            store-release/windows/SHA256.json
            store-release/windows/Tile-Verification.json
            test-results/desktop-native*.png
  ios-screenshots:
    if: inputs.target == 'ios-screenshots'
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.ios_devices == 'tablets' && '["iPad","iPadAir"]' || inputs.ios_devices == 'iPhone' && '["iPhone"]' || inputs.ios_devices == 'iPad' && '["iPad"]' || inputs.ios_devices == 'iPadAir' && '["iPadAir"]' || '["iPhone","iPad","iPadAir"]') }}
    # Standard Intel runners provide 14 GB RAM for simulator startup.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ios-native
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build-for-testing
      - run: python3 scripts/ios-native-tests.py "${{ matrix.device }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-store-screenshots-${{ matrix.device }}
          path: store-release/ios-native/
