name: Android native device checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/android-native-tests.py'
      - 'scripts/native-resources.mjs'
      - 'vite.android.config.js'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' emulator 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:android-native
      - run: bash ./gradlew assembleDebug assembleAndroidTest bundleRelease lintDebug
        working-directory: android
      - run: sudo chmod a+rw /dev/kvm
      - run: python3 scripts/android-native-tests.py
        env:
          TEST_ANDROID_API: ${{ matrix.api }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-native-api-${{ matrix.api }}
          path: |
            test-results/android-native/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
